name: Release

on:
  repository_dispatch:
    types:
      - release

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  release:
    runs-on: ubuntu-latest
    environment: release
    concurrency:
      group: release
      cancel-in-progress: false
    env:
      RELEASE_TAG: ${{ github.event.client_payload.tag }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.event.client_payload.tag }}
          fetch-depth: 0
          persist-credentials: false

      - name: Install test dependencies
        run: sudo apt-get update && sudo apt-get install -y jq zsh

      - name: Validate release source
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          case "$RELEASE_TAG" in
            v[0-9]*) ;;
            *) echo "invalid release tag: $RELEASE_TAG" >&2; exit 1 ;;
          esac
          git fetch --no-tags origin main
          candidate="$(git rev-parse HEAD)"
          tagged="$(git rev-parse "refs/tags/$RELEASE_TAG^{commit}")"
          test "$candidate" = "$tagged"
          git merge-base --is-ancestor "$candidate" origin/main
          test "$RELEASE_TAG" = "$(sh tools/version-tag)"
          latest_tag="$(gh release view --repo "$GITHUB_REPOSITORY" \
            --json tagName --jq .tagName 2>/dev/null || true)"
          if test -n "$latest_tag"; then
            case "$latest_tag" in
              v[0-9]*) ;;
              *) echo "invalid latest release tag: $latest_tag" >&2; exit 1 ;;
            esac
            test "$RELEASE_TAG" != "$latest_tag"
            test "$(printf '%s\n%s\n' "$latest_tag" "$RELEASE_TAG" |
              sort -V | tail -n 1)" = "$RELEASE_TAG"
          fi
          for file in main.zsh .zshrc .zshrc.mac fn/*; do
            zsh -n "$file"
          done
          for file in .zshenv install z4m.zsh sc/exec-zsh-i sc/setup sc/ssh-bootstrap sc/supply-chain tools/build-release tools/verify-dependencies tools/version-tag; do
            sh -n "$file"
          done
          for test_file in test/*.zsh; do
            zsh "$test_file"
          done
          python3 test/benchmark_startup.py
          sh tools/verify-dependencies

      - name: Build deterministic release artifacts
        run: sh tools/build-release "$RELEASE_TAG" dist

      - name: Attest release artifacts
        uses: actions/attest@f7c74d28b9d84cb8768d0b8ca14a4bac6ef463e6 # v4.2.0
        with:
          subject-path: dist/*

      - name: Create or resume draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$RELEASE_TAG" --json isDraft --jq .isDraft >draft-state 2>/dev/null; then
            test "$(cat draft-state)" = true
          else
            gh release create "$RELEASE_TAG" --verify-tag --generate-notes --draft
          fi

      - name: Upload and verify release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "$RELEASE_TAG" dist/* --clobber
          gh release view "$RELEASE_TAG" --json assets --jq '.assets[].name' >asset-names
          for asset in \
            "zsh4monkey-$RELEASE_TAG.tar.gz" \
            "zsh4monkey-$RELEASE_TAG.tar.gz.sha256" \
            install \
            SHA256SUMS; do
            grep -Fqx "$asset" asset-names
          done

      - name: Publish verified release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release edit "$RELEASE_TAG" --draft=false --latest
